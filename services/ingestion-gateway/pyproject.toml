[project]
name = "ingestion-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "protobuf==7.36.2",
    "cramjam==2.14.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "grpcio-tools==1.85.1",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = ["e2e: opt-in tests against running lab services"]
