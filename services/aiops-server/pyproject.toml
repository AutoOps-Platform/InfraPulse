[project]
name = "aiops-server"
version = "0.1.0"
description = "InfraPulse AIOps Agent Backend (SaSa AI) with DeepSeek, Ollama, Gemini, and Jev Decision Model integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic-ai>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: opt-in live connectivity tests requiring running Ollama or real API keys (AIOPS_RUN_LIVE_TESTS=1)",
]
