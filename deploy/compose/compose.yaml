name: infrapulse

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:?PROMETHEUS_IMAGE_TAG must be set and non-empty}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - type: bind
        source: ../../observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: prometheus_data
        target: /prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:?GRAFANA_IMAGE_TAG must be set and non-empty}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set and non-empty}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: sqlite3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
      - type: bind
        source: ../../observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG must be set and non-empty}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
      # PostgreSQL 18 layout: mount the parent, not the pre-18 data path.
      PGDATA: /var/lib/postgresql/18/docker
      # Cover loopback TCP at init, not just the appended broad host rule.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    build:
      context: ../../services/ingestion-gateway
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT:-8000}:8000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    # Deliberate allowlist: never inject the root dotenv or database credentials.
    environment:
      INGEST_PROMETHEUS_WRITE_URL: ${INGEST_PROMETHEUS_WRITE_URL:-http://prometheus:9090/api/v1/write}
      INGEST_PROMETHEUS_READY_URL: ${INGEST_PROMETHEUS_READY_URL:-http://prometheus:9090/-/ready}
      INGEST_MAX_COMPRESSED_BYTES: ${INGEST_MAX_COMPRESSED_BYTES:-1048576}
      INGEST_MAX_DECOMPRESSED_BYTES: ${INGEST_MAX_DECOMPRESSED_BYTES:-8388608}
      INGEST_MAX_SERIES: ${INGEST_MAX_SERIES:-5000}
      INGEST_MAX_SAMPLES: ${INGEST_MAX_SAMPLES:-20000}
      INGEST_MAX_LABELS_PER_SERIES: ${INGEST_MAX_LABELS_PER_SERIES:-64}
      INGEST_MAX_INFLIGHT: ${INGEST_MAX_INFLIGHT:-2}
      INGEST_RATE_PER_SECOND: ${INGEST_RATE_PER_SECOND:-10}
      INGEST_RATE_BURST: ${INGEST_RATE_BURST:-20}
      INGEST_MAX_SAMPLE_AGE_SECONDS: ${INGEST_MAX_SAMPLE_AGE_SECONDS:-3600}
      INGEST_MAX_FUTURE_SKEW_SECONDS: ${INGEST_MAX_FUTURE_SKEW_SECONDS:-120}
      INGEST_BODY_READ_TIMEOUT_SECONDS: ${INGEST_BODY_READ_TIMEOUT_SECONDS:-5}
      INGEST_CONNECT_TIMEOUT_SECONDS: ${INGEST_CONNECT_TIMEOUT_SECONDS:-2}
      INGEST_READ_TIMEOUT_SECONDS: ${INGEST_READ_TIMEOUT_SECONDS:-10}
      INGEST_WRITE_TIMEOUT_SECONDS: ${INGEST_WRITE_TIMEOUT_SECONDS:-10}
      INGEST_POOL_TIMEOUT_SECONDS: ${INGEST_POOL_TIMEOUT_SECONDS:-1}
      INGEST_UPSTREAM_DEADLINE_SECONDS: ${INGEST_UPSTREAM_DEADLINE_SECONDS:-12}
      INGEST_READY_TIMEOUT_SECONDS: ${INGEST_READY_TIMEOUT_SECONDS:-1}
      INGEST_LOG_LEVEL: ${INGEST_LOG_LEVEL:-INFO}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
