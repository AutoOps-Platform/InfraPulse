name: infrapulse

x-management-hardening: &management-hardening
  user: "10002:10002"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:?PROMETHEUS_IMAGE_TAG must be set and non-empty}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - type: bind
        source: ../../observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: prometheus_data
        target: /prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:?GRAFANA_IMAGE_TAG must be set and non-empty}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set and non-empty}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: sqlite3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
      - type: bind
        source: ../../observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG must be set and non-empty}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
      # PostgreSQL 18 layout: mount the parent, not the pre-18 data path.
      PGDATA: /var/lib/postgresql/18/docker
      # Cover loopback TCP at init, not just the appended broad host rule.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    build:
      context: ../../services/ingestion-gateway
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT:-8000}:8000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
      management:
        condition: service_healthy
    user: "10001:10001"
    volumes:
      - type: bind
        source: ${INGEST_SERVICE_SIGNING_KEY_FILE:?Gateway private key path required}
        target: /run/secrets/gateway-signing-key
        read_only: true
        bind:
          create_host_path: false
    # Deliberate allowlist: never inject the root dotenv or database credentials.
    environment:
      INGEST_PROMETHEUS_WRITE_URL: ${INGEST_PROMETHEUS_WRITE_URL:-http://prometheus:9090/api/v1/write}
      INGEST_PROMETHEUS_READY_URL: ${INGEST_PROMETHEUS_READY_URL:-http://prometheus:9090/-/ready}
      INGEST_MAX_COMPRESSED_BYTES: ${INGEST_MAX_COMPRESSED_BYTES:-1048576}
      INGEST_MAX_DECOMPRESSED_BYTES: ${INGEST_MAX_DECOMPRESSED_BYTES:-8388608}
      INGEST_MAX_SERIES: ${INGEST_MAX_SERIES:-5000}
      INGEST_MAX_SAMPLES: ${INGEST_MAX_SAMPLES:-20000}
      INGEST_MAX_LABELS_PER_SERIES: ${INGEST_MAX_LABELS_PER_SERIES:-64}
      INGEST_MAX_INFLIGHT: ${INGEST_MAX_INFLIGHT:-2}
      INGEST_RATE_PER_SECOND: ${INGEST_RATE_PER_SECOND:-10}
      INGEST_RATE_BURST: ${INGEST_RATE_BURST:-20}
      INGEST_MAX_SAMPLE_AGE_SECONDS: ${INGEST_MAX_SAMPLE_AGE_SECONDS:-3600}
      INGEST_MAX_FUTURE_SKEW_SECONDS: ${INGEST_MAX_FUTURE_SKEW_SECONDS:-120}
      INGEST_BODY_READ_TIMEOUT_SECONDS: ${INGEST_BODY_READ_TIMEOUT_SECONDS:-5}
      INGEST_CONNECT_TIMEOUT_SECONDS: ${INGEST_CONNECT_TIMEOUT_SECONDS:-2}
      INGEST_READ_TIMEOUT_SECONDS: ${INGEST_READ_TIMEOUT_SECONDS:-10}
      INGEST_WRITE_TIMEOUT_SECONDS: ${INGEST_WRITE_TIMEOUT_SECONDS:-10}
      INGEST_POOL_TIMEOUT_SECONDS: ${INGEST_POOL_TIMEOUT_SECONDS:-1}
      INGEST_UPSTREAM_DEADLINE_SECONDS: ${INGEST_UPSTREAM_DEADLINE_SECONDS:-12}
      INGEST_READY_TIMEOUT_SECONDS: ${INGEST_READY_TIMEOUT_SECONDS:-1}
      INGEST_LOG_LEVEL: ${INGEST_LOG_LEVEL:-INFO}
      INGEST_MANAGEMENT_BASE_URL: ${INGEST_MANAGEMENT_BASE_URL:-http://management:3000}
      INGEST_GATEWAY_ID: ${INGEST_GATEWAY_ID:?fixed canonical gateway UUID required}
      INGEST_SERVICE_KEY_ID: ${INGEST_SERVICE_KEY_ID:?trusted Gateway kid required}
      INGEST_SERVICE_SIGNING_KEY_FILE: /run/secrets/gateway-signing-key
      INGEST_CREDENTIAL_TIMEOUT_SECONDS: ${INGEST_CREDENTIAL_TIMEOUT_SECONDS:-2}
      INGEST_CREDENTIAL_CACHE_TTL_SECONDS: ${INGEST_CREDENTIAL_CACHE_TTL_SECONDS:-30}
      INGEST_CREDENTIAL_CACHE_MAX_ENTRIES: ${INGEST_CREDENTIAL_CACHE_MAX_ENTRIES:-1024}
      INGEST_STATUS_INTERVAL_SECONDS: ${INGEST_STATUS_INTERVAL_SECONDS:-10}
      INGEST_STATUS_TIMEOUT_SECONDS: ${INGEST_STATUS_TIMEOUT_SECONDS:-2}
      INGEST_STATUS_MAX_PENDING_AGENTS: ${INGEST_STATUS_MAX_PENDING_AGENTS:-1024}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  management:
    <<: *management-hardening
    build:
      context: ../../services/management-backend
      target: runtime
    ports:
      - "127.0.0.1:${MANAGEMENT_HOST_PORT:-3001}:3000"
    networks: [monitoring, database]
    depends_on:
      postgres:
        condition: service_healthy
    # Bootstrap/deploy/seed are explicit prior operator actions, never startup hooks.
    environment:
      PORT: "3000"
      MANAGEMENT_DATABASE_URL_FILE: /run/secrets/runtime-url
      MANAGEMENT_ADMIN_TRUST_FILE: /run/secrets/admin-trust
      MANAGEMENT_SERVICE_TRUST_FILE: /run/secrets/service-trust
      MANAGEMENT_GRAFANA_CONTEXT: ${MANAGEMENT_GRAFANA_CONTEXT:?explicit Grafana context required}
      MANAGEMENT_AGENT_INGEST_BASE_URL: ${MANAGEMENT_AGENT_INGEST_BASE_URL:-http://127.0.0.1:8000}
      MANAGEMENT_LOG_LEVEL: ${MANAGEMENT_LOG_LEVEL:-INFO}
      MANAGEMENT_REQUEST_RATE_PER_SECOND: ${MANAGEMENT_REQUEST_RATE_PER_SECOND:-20}
      MANAGEMENT_REQUEST_BURST: ${MANAGEMENT_REQUEST_BURST:-40}
      MANAGEMENT_DB_POOL_MAX: ${MANAGEMENT_DB_POOL_MAX:-10}
      MANAGEMENT_DB_POOL_TIMEOUT_MS: ${MANAGEMENT_DB_POOL_TIMEOUT_MS:-1000}
      MANAGEMENT_NONCE_MAX_ENTRIES: ${MANAGEMENT_NONCE_MAX_ENTRIES:-20000}
    volumes:
      - type: bind
        source: ${MANAGEMENT_DATABASE_URL_FILE:?runtime URL path required}
        target: /run/secrets/runtime-url
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MANAGEMENT_ADMIN_TRUST_FILE:?admin public trust path required}
        target: /run/secrets/admin-trust
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MANAGEMENT_SERVICE_TRUST_FILE:?service public trust path required}
        target: /run/secrets/service-trust
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "try { const r = await fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2000)}); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  management-bootstrap:
    <<: *management-hardening
    profiles: [management-ops]
    build: {context: ../../services/management-backend, target: migrate}
    command: [node, scripts/bootstrap-db.ts]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    environment:
      MANAGEMENT_BOOTSTRAP_DATABASE_URL_FILE: /run/secrets/bootstrap-url
      MANAGEMENT_MIGRATION_DATABASE_URL_FILE: /run/secrets/owner-url
      MANAGEMENT_DATABASE_URL_FILE: /run/secrets/runtime-url
    volumes:
      - type: bind
        source: ${MANAGEMENT_BOOTSTRAP_DATABASE_URL_FILE:?operator bootstrap URL path required}
        target: /run/secrets/bootstrap-url
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MANAGEMENT_MIGRATION_DATABASE_URL_FILE:?owner URL path required}
        target: /run/secrets/owner-url
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MANAGEMENT_DATABASE_URL_FILE:?runtime URL path required}
        target: /run/secrets/runtime-url
        read_only: true
        bind: {create_host_path: false}

  management-migrate:
    <<: *management-hardening
    profiles: [management-ops]
    build: {context: ../../services/management-backend, target: migrate}
    command: [node, scripts/migrate-db.ts]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    environment:
      MANAGEMENT_MIGRATION_DATABASE_URL_FILE: /run/secrets/owner-url
    volumes:
      - type: bind
        source: ${MANAGEMENT_MIGRATION_DATABASE_URL_FILE:?owner URL path required}
        target: /run/secrets/owner-url
        read_only: true
        bind: {create_host_path: false}

  management-seed:
    <<: *management-hardening
    profiles: [management-ops]
    build: {context: ../../services/management-backend, target: migrate}
    command: [node, scripts/seed-db.ts]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    environment:
      MANAGEMENT_MIGRATION_DATABASE_URL_FILE: /run/secrets/owner-url
      INGEST_GATEWAY_ID: ${INGEST_GATEWAY_ID:?fixed canonical gateway UUID required}
    volumes:
      - type: bind
        source: ${MANAGEMENT_MIGRATION_DATABASE_URL_FILE:?owner URL path required}
        target: /run/secrets/owner-url
        read_only: true
        bind: {create_host_path: false}

networks:
  monitoring:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
