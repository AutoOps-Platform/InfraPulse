apiVersion: 1

providers:
  - name: infrapulse
    orgId: 1
    folder: InfraPulse
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Only generated immutable CloudWatch outputs; never templates/original archives.
      # Outside /var/lib/grafana so the persistent SQLite/data mount cannot shadow it.
      path: /opt/infrapulse/dashboards
      foldersFromFilesStructure: false
