apiVersion: 1

providers:
  - name: infrapulse
    orgId: 1
    folder: InfraPulse
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Only the two InfraPulse adaptations; downloaded originals remain archival.
      path: /etc/grafana/dashboards/infrapulse
      foldersFromFilesStructure: false
