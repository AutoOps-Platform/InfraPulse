apiVersion: 1

contactPoints:
  - orgId: 1
    name: infrapulse-aiops-webhook
    receivers:
      - uid: infrapulse-aiops-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${INFRAPULSE_AIOPS_WEBHOOK_URL:-http://127.0.0.1:8001/api/v1/webhooks/grafana}
          httpMethod: POST
          maxAlerts: 0
          extra_headers:
            X-AIOps-Webhook-Token: ${AIOPS_WEBHOOK_SECRET}
