apiVersion: 1

policies:
  - orgId: 1
    receiver: infrapulse-aiops-webhook
    group_by:
      - alertname
      - server_id
      - container
      - endpoint
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: infrapulse-aiops-webhook
        object_matchers:
          - ['source_system', '=', 'infrapulse']
          - ['severity', '=', 'critical']
        group_by:
          - alertname
          - server_id
          - container
          - endpoint
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 1h
        continue: false
      - receiver: infrapulse-aiops-webhook
        object_matchers:
          - ['source_system', '=', 'infrapulse']
        group_by:
          - alertname
          - server_id
          - container
          - endpoint
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: false
