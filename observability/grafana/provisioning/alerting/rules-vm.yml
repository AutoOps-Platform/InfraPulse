        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          domain: vm
          platform: windows
          source_system: infrapulse
        annotations:
          summary: "High CPU usage on Windows VM {{ $labels.server_id }}"
          description: "Windows VM {{ $labels.server_id }} CPU utilization exceeded 85% (current: {{ printf \"%.1f\" $values.B.Value }}%) over the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: infrapulse-amp
            model:
              editorMode: code
              expr: 100 - avg by (server_id, managed_node_id, platform) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100
              instant: false
              range: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              refId: C

      - uid: infrapulse-windows-memory-high
        title: WindowsMemoryHigh
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          domain: vm
          platform: windows
          source_system: infrapulse
        annotations:
          summary: "High memory usage on Windows VM {{ $labels.server_id }}"
          description: "Windows VM {{ $labels.server_id }} memory utilization exceeded 85% (current: {{ printf \"%.1f\" $values.B.Value }}%)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: infrapulse-amp
            model:
              editorMode: code
              expr: (1 - windows_memory_available_bytes / windows_cs_physical_memory_bytes) * 100
              instant: false
              range: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
              refId: C

      - uid: infrapulse-windows-disk-low
        title: WindowsDiskLow
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          domain: vm
          platform: windows
          source_system: infrapulse
        annotations:
          summary: "Low disk space on Windows VM {{ $labels.server_id }} ({{ $labels.volume }})"
          description: "Logical volume {{ $labels.volume }} on Windows VM {{ $labels.server_id }} has less than 15% free space remaining (current: {{ printf \"%.1f\" $values.B.Value }}%)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: infrapulse-amp
            model:
